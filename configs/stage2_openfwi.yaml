# CurveVel_A: 20 geologies x 5 scenarios x 4 trajectory steps.
output_dir: ../outputs/stage2_openfwi
dataset:
  manifest: ../outputs/dataset_openfwi/manifest.json
  auto_build: true
  max_iters: 4
  stage1_config:
    grid: {nz: 64, nx: 64, dz: 10.0, dx: 10.0}
    physics: {dt: 0.001, nt: 350, f0: 15.0, npml: 12, shot_batch_size: 4}
    acquisition: {n_shots: 8, n_rec: 56, margin: 4, src_depth_idx: 2, rec_depth_idx: 2}
    model:
      npy_path: ../data/openfwi/Vel Family/CurveVel_A/model/model1.npy
      index: 0
      seed: 42
      method: gaussian
      sigma: 5.0
    inversion: {lr: 5.0, optimizer: adam, v_bounds: [1500.0, 5000.0]}
    dataset:
      n_models: 20
      n_iters: 4
      scenarios: [normal, low_freq_cut, noisy, sparse, biased_init]
      f_cut: 7.0
      snr_db: 15.0
      sparse_ratio: 0.5
      bias_mps: 150.0
      split_fractions: [0.8, 0.1, 0.1]
model: {base_channels: 32, cond_dim: 32, eps_sigma: 0.001, alpha: 10.0}
loss: {mu: 0.5, lambda_unc: 0.1, eps: 0.0001, detach_err_for_unc: false}
training: {epochs: 40, batch_size: 4, lr: 0.0005, weight_decay: 0.01, num_workers: 0, seed: 42}
