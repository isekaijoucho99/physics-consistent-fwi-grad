output_dir: ../outputs/paper1_benchmarks
a3_checkpoint: ../outputs/paper1_ablation_formal/A3_stage2_full/best.pt
a5_checkpoint: ../outputs/paper1_ablation_formal/A5_proposed_full/best.pt
grid: {nz: 64, nx: 160, dz: 15.0, dx: 15.0}
physics: {dt: 0.001, nt: 1100, f0: 10.0, npml: 14, shot_batch_size: 8}
acquisition: {n_shots: 24, n_rec: 80, margin: 6}
benchmarks:
  - {name: marmousi2, npy_path: ../data/benchmarks/marmousi2.npy, sigma: 4.0, v_bounds: [1000.0, 5000.0]}
  - {name: overthrust, npy_path: ../data/benchmarks/overthrust.npy, sigma: 4.0, v_bounds: [2000.0, 6200.0]}
f_cuts: [0.0, 5.0]
closed_loop: {n_iters: 120, lr: 30.0, sparse_ratio: 0.125, n_check_shots: 2, max_backtracks: 3, optimizer: adam}
