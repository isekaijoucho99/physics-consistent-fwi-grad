# Paths are relative to this file. A missing checkpoint is reported as a scratch run.
output_dir: ../outputs/stage3_smoke
pretrained_checkpoint: ../outputs/stage2_smoke/best.pt
allow_scratch: true
dataset:
  manifest: ../outputs/dataset/manifest.json
  auto_build: true
  stage1_config: stage1_smoke.yaml
  max_iters: 2
model: {base_channels: 8, cond_dim: 16, eps_sigma: 0.001, alpha: 10.0}
loss: {mu: 0.5, lambda_unc: 0.1, eps: 0.0001}
training: {epochs: 2, batch_size: 2, lr: 0.0003, weight_decay: 0.01, num_workers: 0, seed: 42}
physics_loss:
  lambda_dir: 0.05
  lambda_data: 0.5
  lambda_str: 0.02
  warmup_epochs: 2
  physics_subset_size: 1
  n_physics_shots: 1
  eta: 5.0  # matches GuidedFWIConfig.lr via shared propose_update
  rho: 0.01
  max_update_mps: 100.0
guided_fwi: {n_iters: 2, lr: 5.0, sparse_ratio: 0.5, n_check_shots: 2}
