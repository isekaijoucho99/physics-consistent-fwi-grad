# Two independent models per split (one per family), plus one unseen fault-salt case.
output_dir: ../outputs/paper1_ablation_smoke
seed: 42
experiment:
  grid: {nz: 12, nx: 12, dz: 10.0, dx: 10.0}
  physics: {dt: 0.001, nt: 18, f0: 85.0, npml: 2, shot_batch_size: 2}
  acquisition: {n_shots: 2, n_rec: 6, margin: 2}
  model:
    seed: 42
    method: gaussian
    sigma: 1.5
    # Generate tiny layered stacks locally. Relief is the interface amplitude in grid cells.
    sources:
      - {name: Flat, n_models: 3, smoke_relief_cells: 0.0}
      - {name: Curved, n_models: 3, smoke_relief_cells: 1.6}
  dataset:
    n_iters: 1
    scenarios: [normal, low_freq_cut, noisy, sparse, biased_init]
    split_fractions: [0.34, 0.33, 0.33]
    sparse_ratio: 0.5
    f_cut: 5.0
network: {base_channels: 4, cond_dim: 8}
stage2: {epochs: 2, batch_size: 5, lr: 0.0005, num_workers: 0}
stage3: {epochs: 2, batch_size: 5, lr: 0.0001, num_workers: 0}
physics_loss: {lambda_dir: 0.05, lambda_data: 0.3, lambda_str: 0.01, warmup_epochs: 2,
               physics_subset_size: 1, n_physics_shots: 1, eta: 5.0, rho: 0.01}
closed_loop:
  n_ood_models: 1
  n_iters: 1
  lr: 5.0
  sparse_ratio: 0.5
  n_check_shots: 1
  max_backtracks: 1
