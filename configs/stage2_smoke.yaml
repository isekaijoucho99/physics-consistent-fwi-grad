# Relative paths are resolved from this YAML. Reuse the Stage 1 smoke split.
output_dir: ../outputs/stage2_smoke
dataset:
  manifest: ../outputs/dataset/manifest.json
  auto_build: true
  stage1_config: stage1_smoke.yaml
  max_iters: 2
model: {base_channels: 8, cond_dim: 16, eps_sigma: 0.001, alpha: 10.0}
loss: {mu: 0.5, lambda_unc: 0.1, eps: 0.0001, detach_err_for_unc: false}
training: {epochs: 3, batch_size: 2, lr: 0.001, weight_decay: 0.01, num_workers: 0, seed: 42}
